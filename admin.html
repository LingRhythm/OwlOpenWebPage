<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵头鹰开发社管理页</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-green': '#39ff14', 'neon-cyan': '#00f3ff', 'neon-red': '#ff2a2a',
                        'dark-bg': '#0a0a12', 'card-bg': '#151520',
                    },
                    fontFamily: {
                        'pixel': ['"Courier New"', 'Courier', 'monospace'],
                        'sans': ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 强制覆盖样式，确保可见性 */
        body { background-color: #0a0a12; color: #ffffff; }
        
        /* 扫描线效果 */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 50; opacity: 0.2;
        }

        /* 表格样式 */
        .custom-table { width: 100%; border-collapse: collapse; }
        .custom-table th { 
            text-align: left; padding: 12px; background: #1f1f25; 
            color: #888; font-size: 12px; font-family: monospace; border-bottom: 2px solid #333;
        }
        .custom-table td { 
            padding: 12px; border-bottom: 1px solid #2a2a35; 
            color: #ddd; font-size: 13px; vertical-align: middle;
        }
        .custom-table tr:hover { background: #1a1a20; }
        
        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a12; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #39ff14; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans">

    <div class="scanlines"></div>

    <!-- 顶部导航 -->
    <header class="h-16 bg-card-bg border-b border-gray-800 flex items-center justify-between px-6 z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-neon-green rounded-full shadow-[0_0_10px_#39ff14] animate-pulse"></div>
            <h1 class="font-pixel font-bold text-white text-xl tracking-wider">喵头鹰开发社<span class="text-neon-cyan">管理页</span></h1>
            <div id="status-msg" class="ml-4 text-xs font-mono text-gray-500 border border-gray-700 px-2 py-0.5 rounded">
                Connecting...
            </div>
        </div>
        <div class="flex gap-4">
            <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 text-white px-3 py-1.5 text-xs font-pixel border border-gray-600 rounded flex items-center gap-2 transition-colors">
                <span>📂</span> 导入文件
                <input type="file" id="fileInput" accept=".json" class="hidden" onchange="handleFileUpload(this)">
            </label>
            <button onclick="exportJson()" class="bg-neon-green hover:bg-white text-black px-4 py-1.5 text-xs font-pixel font-bold flex items-center gap-2 transition-colors hover:scale-105">
                <span>💾</span> 导出 JSON
            </button>
        </div>
    </header>

    <!-- 主布局 -->
    <div class="flex flex-1 overflow-hidden relative z-10">
        
        <!-- 左侧菜单 -->
        <aside class="w-64 bg-dark-bg border-r border-gray-800 flex flex-col p-4 gap-2">
            <div class="text-[10px] font-pixel text-gray-500 mb-2 uppercase tracking-widest">收集品</div>
            
            <button onclick="switchTab('games')" id="tab-games" class="nav-btn text-left px-4 py-3 rounded font-pixel text-sm bg-gray-800 text-white border-l-2 border-neon-cyan flex justify-between items-center group">
                <span>游戏</span>
                <span id="count-games" class="text-xs bg-black/50 px-2 rounded text-gray-400 group-hover:text-white">0</span>
            </button>
            
            <button onclick="switchTab('resources')" id="tab-resources" class="nav-btn text-left px-4 py-3 rounded font-pixel text-sm hover:bg-gray-800 text-gray-400 border-l-2 border-transparent hover:border-neon-yellow flex justify-between items-center group">
                <span>资源</span>
                <span id="count-resources" class="text-xs bg-black/50 px-2 rounded text-gray-400 group-hover:text-white">0</span>
            </button>
            
            <button onclick="switchTab('blogPosts')" id="tab-blogPosts" class="nav-btn text-left px-4 py-3 rounded font-pixel text-sm hover:bg-gray-800 text-gray-400 border-l-2 border-transparent hover:border-neon-pink flex justify-between items-center group">
                <span>文章</span>
                <span id="count-blogPosts" class="text-xs bg-black/50 px-2 rounded text-gray-400 group-hover:text-white">0</span>
            </button>

            <!-- 底部调试信息 -->
            <div class="mt-auto pt-4 border-t border-gray-800">
                <div class="p-3 bg-black/40 rounded border border-gray-800">
                    <div class="text-[10px] text-gray-500 mb-1">DATA DIAGNOSTIC</div>
                    <div id="debug-info" class="text-[10px] font-mono text-neon-cyan break-all">No Data</div>
                    <button onclick="clearCache()" class="mt-2 w-full text-[10px] text-red-500 hover:text-red-400 border border-red-900/30 hover:bg-red-900/20 py-1">清除缓存 & 重置</button>
                </div>
            </div>
        </aside>

        <!-- 右侧内容 -->
        <main class="flex-1 flex flex-col bg-[#0d0d14] overflow-hidden">
            <!-- 工具栏 -->
            <div class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-card-bg/50 backdrop-blur shrink-0">
                <h2 id="page-title" class="text-lg font-bold text-white tracking-wide">数据</h2>
                <div class="flex gap-3">
                    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="搜索内容..." class="bg-black border border-gray-700 text-xs px-3 py-1.5 w-64 rounded text-white focus:border-neon-cyan outline-none">
                    <button onclick="openEditModal()" class="bg-neon-cyan/10 text-neon-cyan border border-neon-cyan/50 px-4 py-1.5 text-xs font-pixel hover:bg-neon-cyan hover:text-black transition-all font-bold">
                        + 新增条目
                    </button>
                </div>
            </div>

            <!-- 表格容器 -->
            <div class="flex-1 overflow-auto p-6">
                <div class="border border-gray-800 rounded-lg overflow-hidden bg-[#151520] shadow-xl">
                    <table class="custom-table">
                        <thead id="table-header"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="fixed inset-0 z-50 hidden">
        <!-- 背景 -->
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity" onclick="closeEditModal()"></div>
        <!-- 滑动面板 -->
        <div class="absolute right-0 top-0 h-full w-[600px] bg-[#1a1a20] border-l border-gray-600 shadow-2xl flex flex-col transform transition-transform duration-300 translate-x-full" id="modalPanel">
            <div class="p-5 border-b border-gray-700 bg-black flex justify-between items-center">
                <h3 class="font-bold text-white text-lg font-pixel" id="modal-title">EDIT ENTRY</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-white px-2">ESC</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-8 bg-[#15151a]">
                <form id="editForm" class="space-y-5">
                    <!-- JS 生成表单 -->
                </form>
            </div>

            <div class="p-5 border-t border-gray-700 bg-black flex justify-end gap-3">
                <button type="button" onclick="closeEditModal()" class="px-5 py-2 text-sm text-gray-400 hover:text-white border border-gray-700 hover:border-gray-500 rounded">取消</button>
                <button type="button" onclick="saveEntry()" class="bg-neon-green text-black px-8 py-2 text-sm font-bold hover:bg-white hover:scale-105 transition-all rounded shadow-[0_0_15px_rgba(57,255,20,0.3)]">保存更改</button>
            </div>
        </div>
    </div>

    <script>
        // === 核心配置 ===
        const STORAGE_KEY = 'indie_dev_v4';
        let appData = { games: [], resources: [], blogPosts: [] };
        let currentTab = 'games';
        let editingIndex = -1;

        // === Schema 定义 (完全匹配 data.json) ===
        const schemas = {
            games: [
                { key: 'title', label: '标题', type: 'text' },
                { key: 'desc', label: '描述', type: 'textarea' },
                { key: 'engine', label: '使用引擎', type: 'text', width: '10%' },
                { key: 'year', label: '年份', type: 'text', width: '10%' },
                { key: 'team', label: '队伍或队员', type: 'text', width: '15%' },
                { key: 'link', label: '链接', type: 'text', width: '15%' },
                { key: 'color', label: '主题颜色', type: 'select', options: ['neon-green', 'neon-cyan', 'neon-purple', 'neon-red', 'neon-yellow', 'neon-pink', 'white'] },
                { key: 'bgText', label: '背景颜色', type: 'text' },
                { key: 'imgColor', label: '图片颜色', type: 'text' }
            ],
            resources: [
                { key: 'title', label: '标题', type: 'text' },
                { key: 'category', label: '种类', type: 'select', options: ['TUTORIAL', 'ASSETS', 'BOOK', 'VIDEO', 'NOTE'] },
                { key: 'desc', label: '描述', type: 'textarea' },
                { key: 'link', label: '链接', type: 'text' },
                { key: 'color', label: '高亮颜色', type: 'select', options: ['neon-green', 'neon-cyan', 'neon-purple', 'neon-red', 'neon-yellow', 'white'] }
            ],
            blogPosts: [
                { key: 'id', label: 'ID (Auto)', type: 'number', readonly: true }, // ID 只读
                { key: 'title', label: '标题', type: 'text' },
                { key: 'author', label: '作者', type: 'text' },
                { key: 'date', label: '日期 (YYYY.MM.DD)', type: 'text' },
                { key: 'category', label: '种类', type: 'text' },
                { key: 'summary', label: '概括', type: 'textarea' },
                { key: 'content', label: '内容', type: 'textarea', rows: 8 }
            ]
        };

        // === 初始化 ===
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. 优先加载本地修改
            const localData = localStorage.getItem(STORAGE_KEY);
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    loadData(parsed, "本地缓存");
                    return;
                } catch(e) { console.error("Local data corrupted"); }
            }

            // 2. 加载文件
            try {
                const res = await fetch('data.json');
                if (!res.ok) throw new Error("File not found");
                const json = await res.json();
                loadData(json, "data.json");
            } catch (err) {
                updateStatus("未连接 - 请手动导入", "text-red-500");
                renderTable(); // 渲染空表
            }
        });

        function loadData(json, source) {
            // 简单的数据校验与兜底
            appData = {
                games: Array.isArray(json.games) ? json.games : [],
                resources: Array.isArray(json.resources) ? json.resources : [],
                blogPosts: Array.isArray(json.blogPosts) ? json.blogPosts : []
            };

            updateStatus(`已加载 ()`, "text-neon-green border-neon-green");
            refreshUI();
            saveToLocal(); // 同步到本地
        }

        // === UI 刷新逻辑 ===
        function refreshUI() {
            // 更新计数器
            document.getElementById('count-games').innerText = appData.games.length;
            document.getElementById('count-resources').innerText = appData.resources.length;
            document.getElementById('count-blogPosts').innerText = appData.blogPosts.length;
            
            // 更新调试信息
            const currentData = appData[currentTab];
            const debugText = (currentData && currentData.length > 0) 
                ? "Keys detected: " + Object.keys(currentData[0]).join(", ") 
                : "No items in this collection";
            document.getElementById('debug-info').innerText = debugText;

            renderTable();
        }

        function renderTable() {
            const data = appData[currentTab] || [];
            const schema = schemas[currentTab];
            const thead = document.getElementById('table-header');
            const tbody = document.getElementById('table-body');

            // 1. 渲染表头
            const visibleCols = schema.slice(0, 5); 
            let headHTML = `<th style="width: 50px">#</th>`;
            visibleCols.forEach(col => {
                headHTML += `<th>${col.label.split('(')[0]}</th>`;
            });
            headHTML += `<th style="text-align:right; width: 140px">操作</th>`;
    
            // 修复点1: 将生成的 headHTML 放入 tr 中
            thead.innerHTML = `<tr>${headHTML}</tr>`;

            // 2. 渲染内容
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 40px; color: #666;">暂无数据</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item, index) => {
                let rowHTML = `<td style="color: #666;">${index + 1}</td>`;
        
                visibleCols.forEach(col => {
                    let val = item[col.key];
                    let displayVal = val;

                    // 特殊渲染：颜色
                    if (col.key === 'color') {
                        // 修复点2: 修正了颜色显示的 HTML 结构和变量引用
                        // 使用 bg-${val} 配合之前配置的 safelist 显示颜色
                        displayVal = `<div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full border border-gray-600 bg-${val}"></div>
                            <span class="opacity-60 text-xs">${val}</span>
                        </div>`;
                    }
                    // 特殊渲染：长文本截断
                    else if (typeof val === 'string' && val.length > 30) {
                        displayVal = `<span title="${val}">${val.substring(0, 30)}...</span>`;
                    }
                    // 处理 undefined
                    else if (val === undefined || val === null) {
                        displayVal = '-';
                    }

                    // 修复点3: 补全了 td 标签中的变量名 displayVal
                    rowHTML += `<td>${displayVal}</td>`;
                });

                rowHTML += `
                    <td style="text-align:right;">
                        <!-- 修复点4: 补全了 editEntry 和 deleteEntry 函数中的 index 参数 -->
                        <button onclick="editEntry(${index})" class="text-neon-cyan hover:text-white mr-3 text-xs font-bold hover:underline">编辑</button>
                        <button onclick="deleteEntry(${index})" class="text-neon-red hover:text-white text-xs font-bold hover:underline">删除</button>
                    </td>
                `;
        
                // 修复点5: 将 rowHTML 放入 tr 中
                return `<tr>${rowHTML}</tr>`;
            }).join('');
        }

        // === 编辑逻辑 ===
        function renderForm() {
            const schema = schemas[currentTab];
            const form = document.getElementById('editForm');
            const data = editingIndex >= 0 ? appData[currentTab][editingIndex] : {};

            // 如果是 blogPosts 新建条目，自动生成 ID
            if (editingIndex === -1 && currentTab === 'blogPosts') {
                const maxId = appData.blogPosts.reduce((max, p) => p.id > max ? p.id : max, 0);
                data.id = maxId + 1;
            }

            const html = schema.map(f => {
                const val = data[f.key] !== undefined ? data[f.key] : '';
                // 做一点简单转义，防止内容把 HTML 撑坏
                const safeVal = String(val)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
                const readonlyAttr = f.readonly
                    ? 'readonly disabled style="opacity:0.6;cursor:not-allowed;"'
                    : '';

                const baseClass =
                    "w-full bg-[#0a0a0f] border border-gray-700 rounded p-3 " +
                    "text-white focus:border-neon-cyan outline-none font-mono " +
                    "text-sm transition-colors focus:bg-black";

                let inputHTML = '';

                if (f.type === 'textarea') {
                    // 多行文本：可以输入大段内容
                    inputHTML = `
                        <textarea
                            name="${f.key}"
                            rows="${f.rows || 3}"
                            class="${baseClass}"
                            ${readonlyAttr}
                        >${safeVal}</textarea>
                    `;
                } else if (f.type === 'select') {
                    // 下拉选择：从 f.options 里选
                    const opts = (f.options || [])
                        .map(o => `
                            <option value="${o}" ${o === val ? 'selected' : ''}>
                                ${o}
                            </option>
                        `)
                        .join('');
                    inputHTML = `
                        <select
                            name="${f.key}"
                            class="${baseClass}"
                            ${readonlyAttr}
                        >
                            ${opts}
                        </select>
                    `;
                } else {
                    // 普通输入框：text / number 等
                    inputHTML = `
                        <input
                            type="${f.type}"
                            name="${f.key}"
                            value="${safeVal}"
                            class="${baseClass}"
                            ${readonlyAttr}
                        />
                    `;
                }

                return `
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide">
                            ${f.label}
                        </label>
                        ${inputHTML}
                    </div>
                `;
            }).join('');

            form.innerHTML = html;
        }


        function saveEntry() {
            const formData = new FormData(document.getElementById('editForm'));
            const newItem = {};
            
            schemas[currentTab].forEach(f => {
                let val = formData.get(f.key);
                if (f.type === 'number') val = parseInt(val) || 0;
                newItem[f.key] = val;
            });

            // 保留原有但未在表单显示的字段（防止数据丢失）
            if (editingIndex >= 0) {
                const original = appData[currentTab][editingIndex];
                appData[currentTab][editingIndex] = { ...original, ...newItem };
            } else {
                appData[currentTab].push(newItem);
            }

            saveToLocal();
            refreshUI();
            closeEditModal();
        }

        function deleteEntry(index) {
            if(confirm("确定要删除此条目吗？")) {
                appData[currentTab].splice(index, 1);
                saveToLocal();
                refreshUI();
            }
        }

        // === 交互函数 ===
        function switchTab(tab) {
            currentTab = tab;
            // 更新按钮样式
            ['games', 'resources', 'blogPosts'].forEach(t => {
                // 修复点：getElementById('tab-') 改为 getElementById(`tab-${t}`)
                const btn = document.getElementById(`tab-${t}`); 
        
                if (t === tab) {
                    // 选中状态：高亮背景 + 青色左边框 + 白色文字
                    btn.className = "nav-btn text-left px-4 py-3 rounded font-pixel text-sm bg-gray-800 text-white border-l-2 border-neon-cyan flex justify-between items-center group";
                } else {
                    // 未选中状态：灰色文字 + 透明边框 (Hover时变白)
                    btn.className = "nav-btn text-left px-4 py-3 rounded font-pixel text-sm hover:bg-gray-800 text-gray-400 border-l-2 border-transparent hover:border-white flex justify-between items-center group";
                }
            });

            // 更新页面标题
            document.getElementById('page-title').innerText = tab.toUpperCase().replace(/([A-Z])/g, ' ').trim() + ' DATABASE';
            refreshUI();
        }



        function openEditModal() {
            editingIndex = -1;
            document.getElementById('modal-title').innerText = "ADD NEW ENTRY";
            renderForm();
            document.getElementById('editModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modalPanel').classList.remove('translate-x-full'), 10);
        }

        function editEntry(index) {
            editingIndex = index;
            document.getElementById('modal-title').innerText = "EDIT ENTRY #" + (index + 1);
            renderForm();
            document.getElementById('editModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modalPanel').classList.remove('translate-x-full'), 10);
        }

        function closeEditModal() {
            document.getElementById('modalPanel').classList.add('translate-x-full');
            setTimeout(() => document.getElementById('editModal').classList.add('hidden'), 300);
        }

        function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    loadData(json, "手动导入");
                } catch(err) { alert("JSON 文件格式错误"); }
            };
            reader.readAsText(file);
        }

        function exportJson() {
            const str = JSON.stringify(appData, null, 2);
            const blob = new Blob([str], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "data.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function saveToLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        function clearCache() {
            if(confirm("确定清除本地缓存并重载页面？")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function filterTable() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#table-body tr').forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        }

        function updateStatus(msg, colorClass) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.className = `ml-4 text-xs font-mono border px-2 py-0.5 rounded `;
        }
    </script>
</body>
</html>
