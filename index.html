<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵头鹰开发社管理页</title>
    
    <!-- CSS 框架 (Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind 自定义配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-green': '#39ff14',
                        'neon-purple': '#b026ff',
                        'neon-cyan': '#00f3ff',
                        'neon-pink': '#ff00ff',
                        'neon-yellow': '#ffeb3b',
                        'neon-red': '#ff2a2a',
                        'dark-bg': '#0a0a12',
                        'card-bg': '#151520',
                    },
                    fontFamily: {
                        'pixel': ['"Courier New"', 'Courier', 'monospace'],
                        'sans': ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    typography: (theme) => ({
                        DEFAULT: {
                            css: {
                                color: theme('colors.gray.300'),
                                h1: { color: theme('colors.white') },
                                h2: { color: theme('colors.white') },
                                strong: { color: theme('colors.neon-green') },
                                blockquote: { borderLeftColor: theme('colors.neon-purple') },
                            },
                        },
                    }),
                }
            }
        }
    </script>

    <style>
        /* 基础样式重置 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a12; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #39ff14; }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; pointer-events: none; z-index: 50; opacity: 0.6;
        }

        .retro-grid {
            position: absolute; width: 200%; height: 100%; bottom: -50%; left: -50%;
            background-image: linear-gradient(rgba(57, 255, 20, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(57, 255, 20, 0.2) 1px, transparent 1px);
            background-size: 40px 40px; transform: perspective(500px) rotateX(60deg);
            animation: grid-move 5s linear infinite; z-index: 0; opacity: 0.15;
            mask-image: linear-gradient(to top, black 0%, transparent 80%);
        }

        @keyframes grid-move {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        .glitch { position: relative; }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a12;
        }
        .glitch::before { left: 2px; text-shadow: -1px 0 #b026ff; clip: rect(24px, 550px, 90px, 0); animation: glitch-anim-2 3s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -1px 0 #39ff14; clip: rect(85px, 550px, 140px, 0); animation: glitch-anim 2.5s infinite linear alternate-reverse; }

        @keyframes glitch-anim { 0% { clip: rect(13px, 9999px, 81px, 0); } 100% { clip: rect(44px, 9999px, 96px, 0); } }
        @keyframes glitch-anim-2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 100% { clip: rect(27px, 9999px, 14px, 0); } }

        .game-card:hover .game-overlay { opacity: 1; }
        .modal-content { max-height: 80vh; overflow-y: auto; }
        
        .stat-bar { position: relative; overflow: hidden; }
        .stat-bar::after {
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%); animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 100% { transform: translateX(100%); } }

        .article-body h3 { font-size: 1.25rem; font-weight: bold; color: white; margin-top: 1.5rem; margin-bottom: 0.75rem; border-left: 3px solid #b026ff; padding-left: 0.75rem; }
        .article-body p { margin-bottom: 1rem; line-height: 1.7; color: #d1d5db; }
        .article-body code { background: rgba(0,0,0,0.5); color: #39ff14; padding: 2px 6px; font-family: monospace; border-radius: 4px; }
        .article-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #9ca3af; }

        /* ================= 动画定义区域 ================= */
        
        /* 侧边栏滑入 */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0.5; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in-right {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 弹窗中心弹出 (Pop In) */
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        .animate-modal-pop {
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 列表项上浮淡入 (Staggered Fade Up) */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-item-enter {
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0; /* 初始不可见，等待动画执行 */
        }

        /* 进度条/能力值增长 */
        @keyframes widthGrow {
            from { width: 0%; }
        }
        .animate-width-grow {
            animation: widthGrow 1s ease-out forwards;
        }

    </style>
</head>

    <!-- 交互脚本 -->
    <script>
        // 定义全局变量 (不再使用 const mockData)
        let gameData = [];
        let resourceData = [];
        let blogData = [];

        // 初始化函数：获取数据 -> 渲染页面
        async function initApp() {
            console.log("System initializing...");
            try {
                // 读取本地 JSON 文件
                const response = await fetch('data.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // 赋值全局数据
                gameData = data.games;
                resourceData = data.resources;
                blogData = data.blogPosts;

                console.log("Data loaded successfully.");
                
                // 更新状态指示器
                document.getElementById('library-status').innerText = 'ONLINE';
                document.getElementById('library-status').classList.add('text-neon-green');
                document.getElementById('resource-status').innerText = 'CONNECTED';
                document.getElementById('resource-status').classList.add('text-neon-green');

                // 渲染界面
                initGamesUI();
                initResourcesUI();
                initBlogUI();

            } catch (error) {
                console.error("加载数据失败:", error);
                // 错误处理 UI
                document.getElementById('library-status').innerText = 'ERROR';
                document.getElementById('library-status').classList.add('text-neon-red');
                const featuredGrid = document.getElementById('featured-games-grid');
                if(featuredGrid) featuredGrid.innerHTML = `<div class="col-span-3 text-center text-neon-red font-bold font-pixel p-8 border border-neon-red bg-red-900/20">SYSTEM ERROR: FAILED TO FETCH DATA.JSON<br><span class="text-xs text-gray-400 mt-2 block">请确保你在本地服务器环境中运行 (CORS Policy)</span></div>`;
            }
        }

        // ================= 渲染逻辑 (首页静态) =================

        function initGamesUI() {
            const featuredGrid = document.getElementById('featured-games-grid');
            // 随机显示3个游戏，如果数据不足则显示全部
            const displayCount = Math.min(gameData.length, 3);
            if (featuredGrid) featuredGrid.innerHTML = getRandomItems(gameData, displayCount).map(g => createFeaturedGameHTML(g)).join('');
            
            const gameCounter = document.getElementById('total-games-counter');
            if(gameCounter) animateCounter(gameCounter, gameData.length);
        }

        function initResourcesUI() {
            const featuredResGrid = document.getElementById('featured-resources-grid');
            const displayCount = Math.min(resourceData.length, 4);
            if (featuredResGrid) featuredResGrid.innerHTML = getRandomItems(resourceData, displayCount).map(r => createResourceCardHTML(r)).join('');

            const resCounter = document.getElementById('total-resources-counter');
            if(resCounter) animateCounter(resCounter, resourceData.length);
        }

        function initBlogUI() {
            const blogGrid = document.getElementById('blog-grid');
            if(blogGrid) blogGrid.innerHTML = blogData.map(createBlogCardHTML).join('');
        }

        function openArticleModal(id) {
            const post = blogData.find(p => p.id === id);

            const container = document.getElementById('article-content-container');
            
            container.innerHTML = `

        // ================= 工具函数 =================
        function getRandomItems(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function animateCounter(element, target) {
            let current = 0;
            const timer = setInterval(() => {
                current++;
                element.innerText = current.toString().padStart(2, '0');
                if(current >= target) clearInterval(timer);
            }, 50);
        }

        function playDemo(name) { window.location.href=name }

        // 启动 App (DOM 准备好后调用)
        document.addEventListener('DOMContentLoaded', initApp);

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if(target) target.scrollIntoView({behavior: 'smooth'});
            });
        });
    </script>
